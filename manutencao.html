<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sabadou — voltamos já</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&display=swap">
<script src="js/sabadou-site-links.js?v=20261009-comum-publicacao-20261009"></script>
<script src="config.js?v=20261009-18h-publicacao-20261009"></script>
<script src="js/sabadou-maintenance.js?v=20261010-live-1-publicacao-20261009"></script>
<script>
document.documentElement.dataset.maintenanceCheck='pending';
const revealMaintenance=()=>delete document.documentElement.dataset.maintenanceCheck;
(async()=>{try{
  const settings=await window.SabadouMaintenance.read();
  if(!window.SabadouMaintenance.isActive(settings)){location.replace(window.SabadouSiteLinks.home);return}
}catch(e){console.warn('Não foi possível verificar o modo de manutenção.',e)}revealMaintenance()})();
</script>
<style>html[data-maintenance-check="pending"] body{visibility:hidden}</style>

<style>
:root{
  --bg:#12061f;
  --ink:#f6ecff;
  --pur:#a64dff;
  --hot:#ff4fd8;
  --lil:#f2b8ff;
  --disp:"Bagel Fat One","Arial Black",Impact,sans-serif;
  --sans:"Nunito",system-ui,sans-serif
}

@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f6ecff;
    --ink:#25093a
  }
}

:root[data-theme="dark"]{
  --bg:#12061f;
  --ink:#f6ecff
}

*{
  box-sizing:border-box
}

html{
  min-height:100%;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%
}

body{
  min-height:100vh;
  min-height:100svh;
  margin:0;
  background:
    radial-gradient(55% 50% at 80% 20%,rgba(166,77,255,.4),transparent),
    radial-gradient(45% 45% at 10% 90%,rgba(255,79,216,.25),transparent),
    var(--bg);
  color:var(--ink);
  font:600 1.15rem/1.55 var(--sans);
  overflow-x:hidden
}

main{
  min-height:100vh;
  min-height:100svh;
  display:grid;
  grid-template-columns:minmax(0,1fr);
  place-items:center;
  text-align:center;
  padding:
    calc(env(safe-area-inset-top,0px) + 24px)
    calc(env(safe-area-inset-right,0px) + clamp(16px,4vw,24px))
    calc(env(safe-area-inset-bottom,0px) + 24px)
    calc(env(safe-area-inset-left,0px) + clamp(16px,4vw,24px))
}

.box{
  width:100%;
  max-width:640px;
  min-width:0;
  margin-inline:auto;
  overflow-wrap:anywhere
}

.fr{
  width:min(62vw,300px);
  max-width:100%;
  margin:0 auto 2rem;
  border-radius:32px;
  overflow:hidden;
  box-shadow:0 30px 90px rgba(166,77,255,.55);
  transform:
    perspective(900px)
    rotateX(var(--rx,0deg))
    rotateY(var(--ry,0deg));
  transition:transform .15s
}

.fr img{
  display:block;
  width:100%
}

/* O título acompanha a largura disponível sem alargar o palco no celular. */
h1{
  font:400 clamp(1.8rem,8.8vw,5.4rem)/1.05 var(--disp);
  letter-spacing:-.01em;
  margin:0;
  white-space:normal;
  text-wrap:balance;
}

h1 span{
  display:inline-block;
  white-space:nowrap;
  animation:bob 2.4s ease-in-out infinite;
  animation-delay:calc(var(--i)*90ms)
}

@keyframes bob{
  50%{
    transform:translateY(-8px)
  }
}

#frase{
  font-size:clamp(1.15rem,3vw,1.45rem);
  margin:1.4rem auto 0;
  max-width:24em;
  opacity:.92
}

.tape{
  height:26px;
  margin:2.2rem auto 1rem;
  max-width:420px;
  border-radius:99px;
  border:2px solid var(--pur);
  overflow:hidden;
  background:
    repeating-linear-gradient(
      -45deg,
      var(--pur) 0 16px,
      var(--hot) 16px 32px
    );
  background-size:46px 46px;
  animation:run 1s linear infinite
}

@keyframes run{
  to{
    background-position:46px 0
  }
}

#st{
  min-height:1.6em;
  opacity:.8
}

#volta{
  min-height:1.6em;
  margin-top:.6rem;
  font-weight:800;
  color:var(--lil)
}

.cta{
  display:inline-block;
  max-width:100%;
  margin-top:1.6rem;
  font:inherit;
  font-weight:800;
  text-decoration:none;
  color:#2a0f3d;
  background:var(--lil);
  border-radius:99px;
  padding:.9rem 1.8rem;
  transition:transform .2s,box-shadow .2s
}

.cta:hover{
  transform:translateY(-3px);
  box-shadow:0 0 36px var(--lil)
}

.cta:focus-visible{
  outline:3px solid var(--hot);
  outline-offset:3px
}

small{
  display:block;
  margin-top:2rem;
  opacity:.55
}

.ht{
  position:fixed;
  pointer-events:none;
  width:30px;
  height:30px;
  color:var(--hot);
  animation:fly 1.3s ease-out forwards
}

@keyframes fly{
  to{
    transform:
      translate(var(--dx),-220px)
      rotate(var(--r))
      scale(1.3);
    opacity:0
  }
}

@media (prefers-reduced-motion:reduce){
  h1 span,
  .tape{
    animation:none
  }

  .fr{
    transition:none
  }
}
</style>
</head>

<body>

<main>
  <div class="box">

    <div class="fr" id="fr">
      <img
        src="img/sabadou-classico.jpg"
        alt="Sabadou, o sapo roxo"
        onerror="this.parentNode.style.display='none'"
      >
    </div>

    <h1 id="titulo" aria-label="em manutenção"></h1>

    <p id="frase">
      o sabadou tá arrumando a casa. volta já, calabresos.
    </p>

    <div class="tape" role="presentation"></div>

    <div id="st" aria-live="polite">
      arrumando o sábado...
    </div>

    <div id="volta"></div>

    <a
      class="cta"
      id="ig"
      href="https://www.instagram.com/sabadouofficiall/"
      target="_blank"
      rel="noopener"
    >
      Ver o Instagram
    </a>

    <dialog id="admin-login" style="border:2px solid var(--pur);border-radius:24px;background:var(--bg);color:var(--ink);padding:1.4rem;width:min(92vw,420px)">
      <form id="admin-login-form">
        <h3 style="font:400 1.8rem var(--disp);margin-bottom:1rem">entrar</h3>
        <input id="admin-email" type="email" placeholder="E-mail" autocomplete="username" required style="display:block;width:100%;margin:.7rem 0;padding:.8rem 1rem;border:2px solid var(--pur);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit">
        <input id="admin-password" type="password" placeholder="Senha" autocomplete="current-password" required style="display:block;width:100%;margin:.7rem 0;padding:.8rem 1rem;border:2px solid var(--pur);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit">
        <p id="admin-login-status" aria-live="polite" style="min-height:1.5em;font-size:.95rem;overflow-wrap:anywhere"></p>
        <button class="cta" type="submit">continuar</button>
        <button class="cta" type="button" id="admin-login-close" style="background:transparent;color:var(--ink)">fechar</button>
      </form>
    </dialog>

    <small>
      toque em qualquer lugar 💜
    </small>

  </div>
</main>

<script>

/* ===== EDITE AQUI ===== */

const CONFIG={
  titulo:'em manutenção',
  frase:'o sabadou tá arrumando a casa. volta já, calabresos.',
  instagram:'https://www.instagram.com/sabadouofficiall/',
  status:[
    'arrumando o sábado...',
    'ajustando os calabresos...',
    'dando polimento no sapo...',
    'quase lá...'
  ]
};

/* ====================== */

const $=s=>document.querySelector(s);
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;

// Atalho discreto: cinco toques rápidos no título abrem o login.
let adminTaps=0,adminTapTimer;
$('#titulo').addEventListener('click',()=>{adminTaps++;clearTimeout(adminTapTimer);if(adminTaps>=5){adminTaps=0;$('#admin-login').showModal();$('#admin-email').focus()}else adminTapTimer=setTimeout(()=>adminTaps=0,2200)});
$('#admin-login-close').onclick=()=>$('#admin-login').close();
$('#admin-login-form').onsubmit=async e=>{
  e.preventDefault();const status=$('#admin-login-status'),button=e.submitter||$('#admin-login-form button[type="submit"]');button.disabled=true;status.textContent='Verificando...';
  try{
    const c=typeof SITE_CONFIG!=='undefined'?SITE_CONFIG:(window.SITE_CONFIG||{});if(!c.supabaseUrl||!c.supabaseKey)throw new Error('Login indisponível.');
    await new Promise((ok,no)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';script.onload=ok;script.onerror=no;document.head.appendChild(script)});
    const client=window.supabase.createClient(c.supabaseUrl,c.supabaseKey);
    const login=await client.auth.signInWithPassword({email:$('#admin-email').value.trim(),password:$('#admin-password').value});
    if(login.error)throw new Error('E-mail ou senha incorretos.');
    const check=await client.from('admins').select('user_id').eq('user_id',login.data.user.id).maybeSingle();
    if(check.error||!check.data){await client.auth.signOut();throw new Error('Essa conta não tem acesso de administrador.');}
    status.textContent='Acesso confirmado.';location.replace(window.SabadouSiteLinks.home);
  }catch(error){status.textContent=error.message||'Não foi possível entrar.';button.disabled=false}
};

$('#titulo').innerHTML=[...CONFIG.titulo]
  .map((c,i)=>
    c===' '
      ? ' '
      : `<span style="--i:${i}" aria-hidden="true">${c}</span>`
  )
  .join('');

$('#titulo').setAttribute(
  'aria-label',
  CONFIG.titulo
);

$('#frase').textContent=CONFIG.frase;
$('#ig').href=CONFIG.instagram;

let k=0;
const st=$('#st');

st.textContent=CONFIG.status[0];

setInterval(()=>{
  k=(k+1)%CONFIG.status.length;
  st.textContent=CONFIG.status[k]
},2600);


/* previsão de volta */

function volta(){
  const settings=window.SabadouMaintenance.state;
  const deadline=window.SabadouMaintenance.deadline(settings);
  const retorno=new Date(deadline),t=retorno-Date.now(),el=$('#volta');
  if(!deadline||!Number.isFinite(t)){el.textContent='voltamos em breve, calabresos.';return}
  if(t<=0){el.textContent='Conferindo a volta do site...';return}
  const total=Math.ceil(t/1000),d=Math.floor(total/86400),h=Math.floor(total%86400/3600),m=Math.floor(total%3600/60),s=total%60;
  el.textContent='volta em '+retorno.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',timeZone:'America/Sao_Paulo'})+
    ' às '+retorno.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'})+
    ' (Brasília) · faltam '+(d?d+'d ':'')+(h||d?h+'h ':'')+m+'min '+s+'s';
}
function updateReturn(){
  const settings=window.SabadouMaintenance.state;
  if(settings&&!window.SabadouMaintenance.isActive(settings)){location.replace(window.SabadouSiteLinks.home);return}
  volta();
}
window.addEventListener('sabadou:maintenance',updateReturn);
updateReturn();
setInterval(volta,1000);
// Busca alterações feitas pelo admin enquanto a pessoa espera nesta página.
setInterval(()=>{if(!document.hidden)window.SabadouMaintenance.read().catch(error=>console.warn('Não foi possível atualizar a volta.',error))},15000);


/* inclinação do sapo */

const fr=$('#fr');

addEventListener('pointermove',e=>{

  if(still)return;

  fr.style.setProperty(
    '--ry',
    (e.clientX/innerWidth-.5)*22+'deg'
  );

  fr.style.setProperty(
    '--rx',
    (.5-e.clientY/innerHeight)*22+'deg'
  )

});


/* corações ao tocar */

addEventListener('pointerdown',e=>{

  if(e.target.closest('a'))return;

  for(let i=0;i<5;i++){

    const s=document.createElementNS(
      'http://www.w3.org/2000/svg',
      'svg'
    );

    s.setAttribute(
      'viewBox',
      '0 0 24 24'
    );

    s.setAttribute(
      'class',
      'ht'
    );

    s.innerHTML=
      '<path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.6 2.6 5 6 5c2.1 0 3.4 1.2 4 2.3C10.600 6.200 11.900 5 14 5c3.400 0 5.100 3.600 3.600 6.800C19.500 16.400 12 21 12 21z" transform="translate(0 0)"/>';

    s.style.left=e.clientX-15+'px';
    s.style.top=e.clientY-15+'px';

    s.style.setProperty(
      '--dx',
      (Math.random()-.5)*200+'px'
    );

    s.style.setProperty(
      '--r',
      (Math.random()-.5)*80+'deg'
    );

    s.style.color=[
      '#a64dff',
      '#ff4fd8',
      '#f2b8ff'
    ][i%3];

    s.onanimationend=()=>s.remove();

    document.body.appendChild(s)
  }

});

</script>

</body>
</html>
